
services:
  localstack:
    image: localstack/localstack:latest

    container_name: cgp-localstack

    ports:
      - "127.0.0.1:4566:4566"

    environment:
      SERVICES: s3,ec2,rds,iam,sts,cloudwatch

      AWS_DEFAULT_REGION: ap-south-1

      DEBUG: "0"

      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?err}

    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "curl -fsS http://localhost:4566/_localstack/health"
      interval: 10s
      timeout: 5s
      retries: 10
