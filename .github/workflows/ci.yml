
name: Cloud Governance Platform CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  scanner-tests:
    name: FastAPI Scanner Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scanner-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov moto

      - name: Run scanner tests
        run: |
          python -m pytest -v --cov=app tests/

  auditor-tests:
    name: Flask Auditor Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auditor-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run auditor tests
        run: |
          pytest -v --cov=app tests/

  frontend-build:
    name: React Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          VITE_API_BASE_URL: http://localhost:8000

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    needs:
      - scanner-tests
      - auditor-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FastAPI image
        run: |
          docker build -t finops-scanner ./scanner-service

      - name: Build Flask image
        run: |
          docker build -t finops-auditor ./auditor-service

      - name: Build React image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL=https://example.supabase.co \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY=test-key \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 \
            -t finops-frontend ./frontend
