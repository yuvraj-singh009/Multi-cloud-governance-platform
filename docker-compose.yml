
services:

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: finops-frontend
    ports:
      - "5173:80"
    depends_on:
      scanner-service:
        condition: service_healthy
    restart: unless-stopped

  scanner-service:
    build:
      context: ./scanner-service
    container_name: finops-scanner
    env_file:
      - .env
    environment:
      AUDITOR_SERVICE_URL: http://auditor-service:5000
    ports:
      - "8000:8000"
    volumes:
      - ${USERPROFILE}/.aws:/root/.aws:ro
    depends_on:
      auditor-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  auditor-service:
    build:
      context: ./auditor-service
    container_name: finops-auditor
    env_file:
      - .env
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    container_name: finops-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,ec2,iam,sts
      AWS_DEFAULT_REGION: ap-south-1
    volumes:
      - localstack-data:/var/lib/localstack
    profiles:
      - local
    restart: unless-stopped

volumes:
  localstack-data:
